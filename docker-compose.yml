services:
  postgres:
    image: postgres:16-alpine
    container_name: csagil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: csagil_user
      POSTGRES_PASSWORD: csagil_password
      POSTGRES_DB: csagil_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
